<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Kid - AI英语口语练习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 20px;
            margin-bottom: 40px;
        }

        /* 首页级别选择 */
        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }

        .level-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 20px;
            padding: 35px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .level-card:nth-child(1) { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .level-card:nth-child(2) { background: linear-gradient(135deg, #30cfd0 0%, #330867 100%); }
        .level-card:nth-child(3) { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); color: #333; }
        .level-card:nth-child(4) { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); color: #333; }
        .level-card:nth-child(5) { background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); color: #333; }
        .level-card:nth-child(6) { background: linear-gradient(135deg, #ff6e7f 0%, #bfe9ff 100%); }

        .level-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .level-card h2 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .level-card p {
            font-size: 18px;
            opacity: 0.9;
        }

        /* 单元选择页 */
        .unit-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .unit-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
        }

        .unit-card:hover {
            transform: scale(1.05);
            border-color: #667eea;
            background: #e7f3ff;
        }

        .unit-card h3 {
            color: #667eea;
            font-size: 24px;
            margin-bottom: 10px;
        }

        /* 学习页面 */
        .learning-container {
            padding: 20px;
        }

        .word-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 25px;
            color: white;
            text-align: center;
        }

        .word-image {
            width: 200px;
            height: 200px;
            background: white;
            border-radius: 15px;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
        }

        .word-text {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .word-chinese {
            font-size: 32px;
            opacity: 0.9;
        }

        .sentence-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            font-size: 28px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .sentence-card:hover {
            background: #e7f3ff;
            transform: scale(1.02);
        }

        /* AI对话页面 */
        .chat-container {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 30px;
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .message {
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 15px;
            font-size: 24px;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.ai {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-right: 80px;
        }

        .message.user {
            background: #fff;
            border: 3px solid #667eea;
            margin-left: 80px;
            color: #333;
        }

        .message.options {
            background: #fffbea;
            border: 3px dashed #ffa500;
            text-align: center;
        }

        .option-button {
            display: inline-block;
            margin: 10px;
            padding: 15px 30px;
            background: #667eea;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s;
            border: none;
        }

        .option-button:hover {
            background: #764ba2;
            transform: scale(1.1);
        }

        /* 录音控制 */
        .record-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .record-btn {
            padding: 20px 40px;
            font-size: 24px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .record-btn.start {
            background: #ff6b6b;
            color: white;
        }

        .record-btn.start:hover {
            background: #ee5a52;
            transform: scale(1.1);
        }

        .record-btn.stop {
            background: #51cf66;
            color: white;
        }

        .record-btn.listening {
            background: #ff6b6b;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* 数据分析页面 */
        .analysis-container {
            padding: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .stat-card h3 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .weakness-item {
            background: white;
            color: #333;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 20px;
        }

        .strength-badge {
            background: #51cf66;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-left: 10px;
        }

        .weakness-badge {
            background: #ff6b6b;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-left: 10px;
        }

        /* 按钮 */
        .btn {
            display: inline-block;
            padding: 15px 40px;
            font-size: 24px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            margin: 10px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #e7f3ff;
        }

        .btn-container {
            text-align: center;
            margin-top: 30px;
        }

        /* 返回按钮 */
        .back-btn {
            position: fixed;
            top: 30px;
            left: 30px;
            background: white;
            color: #667eea;
            border: 3px solid #667eea;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            transition: all 0.3s;
            z-index: 1000;
        }

        .back-btn:hover {
            background: #667eea;
            color: white;
            transform: scale(1.1);
        }

        /* 复习提醒 */
        .review-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .review-modal.show {
            display: flex;
        }

        .review-content {
            background: white;
            border-radius: 25px;
            padding: 50px;
            text-align: center;
            max-width: 600px;
            animation: slideDown 0.5s;
        }

        @keyframes slideDown {
            from { transform: translateY(-100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .review-content h2 {
            color: #667eea;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .review-content p {
            font-size: 24px;
            margin-bottom: 30px;
            color: #666;
        }

        /* 进度条 */
        .progress-bar {
            width: 100%;
            height: 15px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s;
        }

        /* 隐藏类 */
        .hidden {
            display: none !important;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            h1 { font-size: 36px; }
            .level-card h2 { font-size: 28px; }
            .message { font-size: 18px; }
            .btn { font-size: 18px; padding: 12px 30px; }
        }

        /* 故事页面 */
        .story-container {
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            border-radius: 20px;
            padding: 40px;
            margin: 20px 0;
        }

        .story-title {
            font-size: 36px;
            color: #2d3436;
            text-align: center;
            margin-bottom: 30px;
        }

        .story-content {
            font-size: 24px;
            line-height: 1.8;
            color: #2d3436;
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .story-image {
            text-align: center;
            font-size: 100px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 首页：级别选择 -->
        <div id="homePage" class="page">
            <h1>🎯 English Kid</h1>
            <p class="subtitle">选择你的学习级别，开始英语冒险吧！</p>

            <div class="level-grid">
                <div class="level-card" onclick="app.selectLevel('pre-think')">
                    <h2>🌟 Pre Think</h2>
                    <p>启蒙级 - 从这里开始你的英语之旅</p>
                </div>
                <div class="level-card" onclick="app.selectLevel('think1')">
                    <h2>🚀 Think 1</h2>
                    <p>基础级 - 学习基本词汇和句型</p>
                </div>
                <div class="level-card" onclick="app.selectLevel('think2')">
                    <h2>🎨 Think 2</h2>
                    <p>进阶级 - 丰富你的表达能力</p>
                </div>
                <div class="level-card" onclick="app.selectLevel('think3')">
                    <h2>🎪 Think 3</h2>
                    <p>提高级 - 掌握更多对话技巧</p>
                </div>
                <div class="level-card" onclick="app.selectLevel('think4')">
                    <h2>🎭 Think 4</h2>
                    <p>高级 - 流利表达你的想法</p>
                </div>
                <div class="level-card" onclick="app.selectLevel('think5')">
                    <h2>🏆 Think 5</h2>
                    <p>精通级 - 成为英语小达人</p>
                </div>
            </div>
        </div>

        <!-- 单元选择页 -->
        <div id="unitPage" class="page hidden">
            <button class="back-btn" onclick="app.goHome()">← 返回</button>
            <h1 id="levelTitle"></h1>
            <p class="subtitle">选择一个单元开始学习</p>
            <div id="unitGrid" class="unit-grid"></div>
        </div>

        <!-- 单词学习页 -->
        <div id="wordPage" class="page hidden">
            <button class="back-btn" onclick="app.backToUnits()">← 返回</button>
            <h1>📚 本课单词</h1>
            <div id="wordList"></div>
            <div class="btn-container">
                <button class="btn btn-primary" onclick="app.nextStep()">继续学习 →</button>
            </div>
        </div>

        <!-- 句型学习页 -->
        <div id="sentencePage" class="page hidden">
            <button class="back-btn" onclick="app.backToUnits()">← 返回</button>
            <h1>💬 核心句型</h1>
            <div id="sentenceList"></div>
            <div class="btn-container">
                <button class="btn btn-primary" onclick="app.nextStep()">继续学习 →</button>
            </div>
        </div>

        <!-- 故事页 -->
        <div id="storyPage" class="page hidden">
            <button class="back-btn" onclick="app.backToUnits()">← 返回</button>
            <h1>📖 情景故事</h1>
            <div id="storyContainer"></div>
            <div class="btn-container">
                <button class="btn btn-primary" onclick="app.nextStep()">开始对话练习 →</button>
            </div>
        </div>

        <!-- AI对话页 -->
        <div id="chatPage" class="page hidden">
            <button class="back-btn" onclick="app.backToUnits()">← 返回</button>
            <h1>🤖 AI对话练习</h1>
            <div class="chat-container">
                <div id="chatMessages" class="chat-messages"></div>
                <div class="record-controls">
                    <button id="recordBtn" class="record-btn start" onclick="app.toggleRecording()">
                        🎤 点击说话
                    </button>
                </div>
            </div>
        </div>

        <!-- 数据分析页 -->
        <div id="analysisPage" class="page hidden">
            <button class="back-btn" onclick="app.backToUnits()">← 返回</button>
            <h1>📊 学习报告</h1>
            <div id="analysisContent" class="analysis-container"></div>
            <div class="btn-container">
                <button class="btn btn-primary" onclick="app.goHome()">完成学习</button>
            </div>
        </div>
    </div>

    <!-- 复习提醒弹窗 -->
    <div id="reviewModal" class="review-modal">
        <div class="review-content">
            <h2>🎯 复习时间到啦！</h2>
            <p id="reviewMessage"></p>
            <button class="btn btn-primary" onclick="app.startReview()">开始复习</button>
            <button class="btn btn-secondary" onclick="app.skipReview()">稍后复习</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
